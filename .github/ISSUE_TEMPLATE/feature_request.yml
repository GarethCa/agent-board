name: Feature request
description: Suggest something agent-board should do.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Search the [issues](https://github.com/GarethCa/agent-board/issues) first: it may already be planned.
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you'd like
      description: How you'd want it to work. Sketches welcome.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered

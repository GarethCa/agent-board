packages:
  - apps/*
  - packages/*
overrides:
  # @electron/get 3.x (pinned by app-builder-lib) loads global-agent only for proxy
  # setups; 3.0.0 pulls in roarr 2 -> sprintf-js. 4.1.3 has the same bootstrap API.
  "@electron/get>global-agent": 4.1.3
allowBuilds:
  electron: true
  electron-winstaller: false
  esbuild: true
  node-pty: true
  sharp: false
# `pnpm build` (or any script) on a fresh clone installs dependencies first.
verifyDepsBeforeRun: install

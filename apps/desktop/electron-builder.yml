# Packages the built app (out/) as an unsigned macOS .app: `pnpm package`.
appId: io.github.garethca.agent-board
productName: agent-board
directories:
  output: dist
files:
  - out/**
  - package.json
# Unpacked, so the daemon and Codex's hook forwarder (this executable run as Node) and node-pty's spawn-helper run
# from plain files.
asar: false
# node-pty ships N-API prebuilds, which load in Electron as they are: nothing to rebuild.
npmRebuild: false
mac:
  target: dir
  # Unsigned: a local build for this machine, never distributed.
  identity: null
  category: public.app-category.developer-tools
  # The brand's macOS icon: the art on the macOS icon grid, made into the .icns (brand/BRAND.md).
  icon: ../../brand/png/app-icon/icon-1024-macos-padded.png
# Web tabs keep logins on disk (persist:web): their cookies are encrypted with a key in the OS keychain, as Chrome's
# are, rather than written in plain text where anything running as the user reads them. One-way: a cookie store written
# encrypted is unreadable to a build with the fuse off, so turning it off means renaming the shared partition in the same
# change (SHARED_PARTITION in src/main/web-tabs.ts) and deleting the old store (ADR-0020). The app must still run as
# Node (the daemon and hook forwarder), which leaves the keychain's key in reach of the app's own binary.
electronFuses:
  runAsNode: true
  enableCookieEncryption: true
  # Changing a fuse breaks the build's ad hoc signature, which Apple silicon needs to launch it at all.
  resetAdHocDarwinSignature: true
# Linux (x86-64): a .deb installs the app in /opt/agent-board with `agent-board` on PATH; the tar.gz is the same files
# for any other distribution. No AppImage: the daemon outlives the window and runs the app's own executable, which in an
# AppImage lives on a mount that goes when the window quits.
linux:
  target:
    - deb
    - tar.gz
  executableName: agent-board
  # Named for the app, not the workspace package (`@agent-board/desktop`), which is no file or deb package name.
  artifactName: agent-board-${version}-${arch}.${ext}
  category: Development
  synopsis: An infinite board for your Claude Code and Codex sessions
  description: A desktop app that shows Claude Code and Codex sessions as objects on an infinite board.
  maintainer: agent-board <agent-board@users.noreply.github.com>
  icon: ../../brand/png/app-icon/icon-1024.png
deb:
  packageName: agent-board
  # Electron's own libraries, as electron-builder lists them, plus git, which the daemon runs for worktrees.
  depends:
    - libgtk-3-0 | libgtk-3-0t64
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0 | libatspi2.0-0t64
    - libuuid1
    - libsecret-1-0
    - libasound2 | libasound2t64
    - libgbm1
    - git
